# Пробная сборка для Windows: установщик .exe как артефакт запуска, без релиза. Когда сборка
# проверена на живой Windows, она переезжает в release.yml рядом с macOS и Linux.
name: Windows build

on:
  push:
    branches: [windows-support]
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run build:vendor

      - run: npm run typecheck

      - run: npx electron-vite build

      - run: npx electron-builder --win --x64 --publish never -c.extraMetadata.version=0.0.${{ github.run_number }}

      # Без бандла Claude и esbuild установщик бесполезен: агенты и холсты не запустятся.
      - name: Check bundled tools
        shell: bash
        run: |
          set -eu
          test -f dist/win-unpacked/resources/claude-cli/claude.exe
          test -f dist/win-unpacked/resources/esbuild/esbuild.exe
          test -d dist/win-unpacked/resources/canvas-vendor

      # Приложение должно подняться и открыть окно: ловит падения при запуске на чистой Windows.
      - name: Smoke test
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist/win-unpacked/Atox.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "Atox exited with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: atox-windows
          path: app/dist/*.exe
          if-no-files-found: error
