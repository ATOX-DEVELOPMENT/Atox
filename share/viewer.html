<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Atox</title>
<style>
:root {
  --bg: #e9e8ef;
  --dot: rgba(40, 30, 90, 0.16);
  --text: #2a2935;
  --muted: #777586;
  --accent: #007aff;
  --surface: rgba(255, 255, 255, 0.86);
  --border: rgba(50, 40, 100, 0.12);
  --shadow: rgba(40, 30, 90, 0.16);
  --screen: #ffffff;
  --bezel: #101114;
  --chrome: #f4f4f8;
  --chrome-border: #e8e8ef;
  --address-text: #7b7c8c;
  --ring: #ffffff;
  --group: #dfdee8;
  --group-border: rgba(50, 40, 100, 0.14);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618;
    --dot: rgba(255, 255, 255, 0.12);
    --text: #f5f5f7;
    --muted: #8e8e93;
    --accent: #0a84ff;
    --surface: rgba(44, 44, 46, 0.86);
    --border: rgba(255, 255, 255, 0.1);
    --shadow: rgba(0, 0, 0, 0.5);
    --ring: #2c2c2e;
    --group: #202023;
    --group-border: rgba(255, 255, 255, 0.1);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

#stage {
  position: fixed;
  inset: 0;
  touch-action: none;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  background-image: radial-gradient(circle, var(--dot) 1.2px, transparent 1.4px);
  background-size: 22px 22px;
}
#stage[data-panning="true"] { cursor: grabbing; }
#world {
  --z: 1;
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
}

/* Группа: сплошная рамка под экранами; название и подписи экранов стоят на месте и растут с холстом. */
.group {
  position: absolute;
  left: 0;
  top: 0;
  border: calc(1.5px / var(--z)) solid var(--group-border);
  border-radius: 48px;
  background: var(--group);
}
.group__header {
  position: absolute;
  left: 0;
  top: 0;
  padding: 28px 50px;
  font-size: 56px;
  font-weight: 600;
  line-height: 1.3;
  white-space: nowrap;
  cursor: pointer;
}

/* Экран: подпись над ним, рамка устройства и страница в iframe. */
.screen { position: absolute; left: 0; top: 0; cursor: pointer; }
.screen__label {
  position: absolute;
  left: 0;
  bottom: 100%;
  width: calc(var(--frame-width) * 1px);
  height: 64px;
  padding-bottom: 16px;
  overflow: hidden;
  font-size: 32px;
  font-weight: 500;
  line-height: 48px;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--muted);
}
.screen__device {
  position: absolute;
  inset: 0;
  overflow: hidden;
  padding: var(--top) var(--side) var(--side);
  border-radius: var(--radius);
  background: var(--screen);
  box-shadow: 0 6px 18px var(--shadow);
}
.screen[data-frame="phone"] { --radius: 56px; --inner: 44px; }
.screen[data-frame="tablet"] { --radius: 36px; --inner: 18px; }
.screen[data-frame="window"], .screen[data-frame="browser"] { --radius: 14px; --inner: 0px; }
.screen[data-frame="none"] { --radius: 6px; --inner: 0px; }
.screen[data-frame="phone"] .screen__device,
.screen[data-frame="tablet"] .screen__device { background: var(--bezel); }
.screen__content {
  position: relative;
  overflow: hidden;
  border-radius: var(--inner);
  background: var(--screen);
}
.screen__content iframe { position: absolute; inset: 0; z-index: 1; display: block; border: 0; background: var(--screen); pointer-events: none; }
.screen__thumb { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.screen__placeholder {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
  font-size: 28px;
  color: #9a9aa8;
  background: #f7f7fa;
}
.screen__placeholder[hidden] { display: none; }
.screen__island {
  position: absolute;
  top: calc(var(--top) + 11px);
  left: 50%;
  width: 110px;
  height: 32px;
  border-radius: 999px;
  background: var(--bezel);
  translate: -50% 0;
}
.screen__chrome {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  height: var(--top);
  padding: 0 16px;
  background: var(--chrome);
  border-bottom: 1px solid var(--chrome-border);
}
.screen__lights { display: flex; gap: 8px; }
.screen__lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.screen__lights i:nth-child(2) { background: #febc2e; }
.screen__lights i:nth-child(3) { background: #28c840; }
.screen__address {
  position: absolute;
  left: 50%;
  width: min(360px, 50%);
  height: 28px;
  overflow: hidden;
  padding: 0 16px;
  border: 1px solid var(--chrome-border);
  border-radius: 8px;
  font-size: 13px;
  line-height: 26px;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--address-text);
  background: #fff;
  translate: -50% 0;
}

.links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.link__line {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2px;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}
.link__dot { fill: var(--accent); stroke: var(--ring); stroke-width: 2px; vector-effect: non-scaling-stroke; }

/* Вкладки страниц сверху и управление снизу: плашки поверх холста. */
.pill {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 6px 20px var(--shadow);
}
#controls {
  position: fixed;
  left: 50%;
  bottom: calc(14px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: calc(100vw - 24px);
  translate: -50% 0;
}
#controls .pill { padding: 0 4px; }
#steps[hidden] { display: none; }
.icon-button {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
}
.icon-button:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
.icon-button:disabled { opacity: 0.35; cursor: default; }
.icon-button svg { width: 18px; height: 18px; }
#position { min-width: 0; max-width: 46vw; padding: 0 6px; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#position b { color: var(--text); font-weight: 600; }
/* Страницы холста: строка сверху, на узком экране прокручивается вбок. */
#pages {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top));
  left: calc(12px + env(safe-area-inset-left));
  max-width: calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right));
  gap: 2px;
  padding: 0 4px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  touch-action: pan-x;
}
#pages[hidden] { display: none; }
#pages::-webkit-scrollbar { display: none; }
.page-tab {
  flex: none;
  max-width: 200px;
  height: 28px;
  padding: 0 12px;
  overflow: hidden;
  border-radius: 999px;
  font-size: 13px;
  color: var(--muted);
  text-overflow: ellipsis;
  white-space: nowrap;
}
.page-tab:hover { color: var(--text); background: color-mix(in srgb, var(--text) 6%, transparent); }
.page-tab[aria-current="page"] { color: var(--text); font-weight: 600; background: color-mix(in srgb, var(--text) 10%, transparent); }
.page-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#message { position: fixed; inset: 0; display: none; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<nav id="pages" class="pill" aria-label="Pages" hidden></nav>
<div id="controls">
  <div id="steps" class="pill" hidden>
    <button class="icon-button" id="previous" aria-label="Previous screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <span id="position"></span>
    <button class="icon-button" id="next" aria-label="Next screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <div class="pill">
    <button class="icon-button" id="fit" aria-label="Show everything"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  </div>
</div>
<div id="message"></div>
<script>
'use strict'
const INSETS = {
  phone: { top: 12, right: 12, bottom: 12, left: 12 },
  tablet: { top: 18, right: 18, bottom: 18, left: 18 },
  window: { top: 40, right: 0, bottom: 0, left: 0 },
  browser: { top: 44, right: 0, bottom: 0, left: 0 },
  none: { top: 0, right: 0, bottom: 0, left: 0 }
}
const GROUP_PADDING = { top: 220, side: 64, bottom: 64 }
/** Высота подписи над экраном, в пикселях холста. */
const LABEL_HEIGHT = 64
const FIT_MARGIN = 28
/** Место под верхнюю и нижнюю плашки: вид не прячет содержимое под ними. */
const TOP_RESERVE = 64
/** Со строкой страниц верхним плашкам нужно больше места. */
const TOP_RESERVE_WITH_PAGES = 108
const BOTTOM_RESERVE = 72
const ZOOM = { min: 0.04, max: 3 }
/** Ширина картинки экрана для обзора: крупнее неё на экране — грузится сама страница. */
const THUMB_WIDTH = 640
/**
 * Сколько живых страниц экранов держать сразу: телефону — меньше, иначе браузер выгружает
 * вкладку из памяти и перезагружает её.
 */
const MAX_LIVE = matchMedia('(pointer: coarse)').matches ? 4 : 12
/** Страницы подгружаются, когда холст остановился, а не на каждом кадре жеста. */
const LIVE_DELAY_MS = 150
const FLY_MS = 380
const TAP_DISTANCE = 8

const stage = document.getElementById('stage')
const world = document.getElementById('world')
const shareId = location.pathname.split('/').filter(Boolean)[0]
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)')

let canvas = null
let pages = []
let page = null
let view = { x: 0, y: 0, zoom: 1 }
let flight = 0
let screens = []
let groups = []
let ordered = []
let current = -1
/** Время публикации: часть адресов страниц и картинок, чтобы браузер не показывал старые. */
let version = 0

const el = (tag, className, html) => {
  const node = document.createElement(tag)
  if (className) node.className = className
  if (html !== undefined) node.innerHTML = html
  return node
}
const clamp = (value, min, max) => Math.min(Math.max(value, min), Math.max(min, max))
const escapeHtml = (value) => value.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)

function showMessage(text) {
  const box = document.getElementById('message')
  box.textContent = text
  box.style.display = 'grid'
}

function boundsOf(screen) {
  const i = INSETS[screen.frame]
  return { x: screen.x, y: screen.y, width: screen.width + i.left + i.right, height: screen.height + i.top + i.bottom }
}
function unionOf(rects) {
  const left = Math.min(...rects.map((r) => r.x))
  const top = Math.min(...rects.map((r) => r.y))
  const right = Math.max(...rects.map((r) => r.x + r.width))
  const bottom = Math.max(...rects.map((r) => r.y + r.height))
  return { x: left, y: top, width: right - left, height: bottom - top }
}
function groupRect(group, byId) {
  const content = unionOf(group.screens.map((id) => byId.get(id).bounds))
  return {
    x: content.x - GROUP_PADDING.side,
    y: content.y - GROUP_PADDING.top,
    width: content.width + GROUP_PADDING.side * 2,
    height: content.height + GROUP_PADDING.top + GROUP_PADDING.bottom
  }
}

/* Чтение слева направо, ряды сверху вниз: так же идёт выгрузка в приложении. */
function readingOrder(list) {
  const rows = []
  for (const screen of [...list].sort((a, b) => a.y - b.y || a.x - b.x)) {
    const row = rows[rows.length - 1]
    if (row && screen.y - row[0].y < row[0].height / 2) row.push(screen)
    else rows.push([screen])
  }
  return rows.flatMap((row) => row.sort((a, b) => a.x - b.x))
}

/* Линия от экрана или кнопки к целевому экрану: те же формулы, что в приложении. */
function linkShape(link, byId) {
  const source = byId.get(link.from)
  const target = byId.get(link.to)
  if (!source || !target) return null
  const from = source.bounds
  const to = target.bounds
  let side
  if (to.x >= from.x + from.width) side = 'right'
  else if (to.x + to.width <= from.x) side = 'left'
  else if (to.y >= from.y + from.height) side = 'bottom'
  else if (to.y + to.height <= from.y) side = 'top'
  else {
    const dx = to.x + to.width / 2 - (from.x + from.width / 2)
    const dy = to.y + to.height / 2 - (from.y + from.height / 2)
    side = Math.abs(dx) >= Math.abs(dy) ? (dx >= 0 ? 'right' : 'left') : dy >= 0 ? 'bottom' : 'top'
  }
  let element = null
  if (link.anchor) {
    const i = INSETS[source.frame]
    const x = clamp(link.anchor.x, 0, source.width)
    const y = clamp(link.anchor.y, 0, source.height)
    element = {
      x: from.x + i.left + x,
      y: from.y + i.top + y,
      width: clamp(link.anchor.width, 0, source.width - x),
      height: clamp(link.anchor.height, 0, source.height - y)
    }
  }
  const horizontal = side === 'left' || side === 'right'
  const sign = side === 'right' || side === 'bottom' ? 1 : -1
  const origin = element || from
  const start = horizontal
    ? { x: sign === 1 ? origin.x + origin.width : origin.x, y: origin.y + origin.height / 2 }
    : { x: origin.x + origin.width / 2, y: sign === 1 ? origin.y + origin.height : origin.y }
  const end = horizontal
    ? { x: sign === 1 ? to.x : to.x + to.width, y: clamp(start.y, to.y + 28, to.y + to.height - 28) }
    : { x: clamp(start.x, to.x + 28, to.x + to.width - 28), y: sign === 1 ? to.y : to.y + to.height }
  const distance = horizontal ? Math.abs(end.x - start.x) : Math.abs(end.y - start.y)
  const reach = clamp(distance / 2, 48, 200)
  const c1 = horizontal ? { x: start.x + sign * reach, y: start.y } : { x: start.x, y: start.y + sign * reach }
  const c2 = horizontal ? { x: end.x - sign * reach, y: end.y } : { x: end.x, y: end.y - sign * reach }
  return { path: `M ${start.x} ${start.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${end.x} ${end.y}`, start }
}

/* Вид ------------------------------------------------------------------ */

function viewport() {
  return { width: stage.clientWidth, height: stage.clientHeight }
}

/* Вид, в который `rect` помещается целиком, не заходя под плашки сверху и снизу. */
function viewFitting(rect, margin = FIT_MARGIN) {
  const { width, height } = viewport()
  const top = pages.length > 1 ? TOP_RESERVE_WITH_PAGES : TOP_RESERVE
  const zoom = clamp(
    Math.min((width - margin * 2) / rect.width, (height - top - BOTTOM_RESERVE - margin * 2) / rect.height),
    ZOOM.min,
    ZOOM.max
  )
  return {
    zoom,
    x: width / 2 - (rect.x + rect.width / 2) * zoom,
    y: top + (height - top - BOTTOM_RESERVE) / 2 - (rect.y + rect.height / 2) * zoom
  }
}

const withLabel = (rect) => ({ ...rect, y: rect.y - LABEL_HEIGHT, height: rect.height + LABEL_HEIGHT })

function applyView() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.zoom})`
  world.style.setProperty('--z', String(view.zoom))
  stage.style.backgroundPosition = `${view.x}px ${view.y}px`
  const radius = String(5 / view.zoom)
  for (const dot of world.querySelectorAll('.link__dot')) dot.setAttribute('r', radius)
  scheduleFrames()
}

function setView(next) {
  view = { ...next, zoom: clamp(next.zoom, ZOOM.min, ZOOM.max) }
  applyView()
}

function zoomAround(point, zoom) {
  const next = clamp(zoom, ZOOM.min, ZOOM.max)
  const ratio = next / view.zoom
  return { zoom: next, x: point.x - (point.x - view.x) * ratio, y: point.y - (point.y - view.y) * ratio }
}

function flyTo(target) {
  cancelAnimationFrame(flight)
  if (reduceMotion.matches) return setView(target)
  const { width, height } = viewport()
  const from = view
  const centerOf = (v) => ({ x: (width / 2 - v.x) / v.zoom, y: (height / 2 - v.y) / v.zoom })
  const a = centerOf(from)
  const b = centerOf(target)
  const startedAt = performance.now()
  const step = (now) => {
    const progress = Math.min(1, (now - startedAt) / FLY_MS)
    if (progress >= 1) return setView(target)
    const eased = 1 - (1 - progress) ** 3
    const zoom = from.zoom * (target.zoom / from.zoom) ** eased
    const x = a.x + (b.x - a.x) * eased
    const y = a.y + (b.y - a.y) * eased
    setView({ x: width / 2 - x * zoom, y: height / 2 - y * zoom, zoom })
    flight = requestAnimationFrame(step)
  }
  flight = requestAnimationFrame(step)
}

/* Экран вместе с подписью и, если он в группе, с её названием: оно не остаётся за краем. */
function screenFocus(screen) {
  const rect = withLabel(screen.bounds)
  const group = groups.find((g) => g.screens.includes(screen.id))
  return group ? unionOf([rect, { x: rect.x, y: group.rect.y, width: rect.width, height: 1 }]) : rect
}
function focusScreen(screen) {
  current = ordered.indexOf(screen)
  updatePosition()
  flyTo(viewFitting(screenFocus(screen)))
}
function focusGroup(group) {
  flyTo(viewFitting(group.rect))
}
function allContent() {
  return unionOf([...screens.map((s) => withLabel(s.bounds)), ...groups.map((g) => g.rect)])
}
function showAll() {
  current = -1
  updatePosition()
  flyTo(viewFitting(allContent()))
}

/* Экраны загружаются, только пока их видно и они достаточно крупные. ------- */

let liveTimer = 0
function scheduleFrames() {
  clearTimeout(liveTimer)
  liveTimer = setTimeout(syncFrames, LIVE_DELAY_MS)
}

/**
 * Обзор рисуют картинки экранов. Живая страница грузится, только когда экран в кадре и крупнее
 * своей картинки. Загруженные страницы остаются, пока их не больше `MAX_LIVE`: лишней
 * выгружается та, что дольше всех не была нужна, — и при движении по холсту ничего не мигает.
 */
function syncFrames() {
  const { width, height } = viewport()
  const area = {
    left: -view.x / view.zoom,
    top: -view.y / view.zoom,
    right: (width - view.x) / view.zoom,
    bottom: (height - view.y) / view.zoom
  }
  const cx = (width / 2 - view.x) / view.zoom
  const cy = (height / 2 - view.y) / view.zoom
  const density = devicePixelRatio || 1
  const now = performance.now()
  const wanted = screens
    .filter(({ bounds: b, width: w }) =>
      w * view.zoom * density > THUMB_WIDTH * 1.1 &&
      b.x < area.right && b.x + b.width > area.left && b.y < area.bottom && b.y + b.height > area.top)
    .map((screen) => ({ screen, distance: Math.hypot(screen.bounds.x + screen.bounds.width / 2 - cx, screen.bounds.y + screen.bounds.height / 2 - cy) }))
    .sort((a, b) => a.distance - b.distance)
    .slice(0, MAX_LIVE)
    .map(({ screen }) => screen)
  for (const screen of wanted) {
    screen.usedAt = now
    if (!screen.frame$) {
      const frame = el('iframe')
      frame.setAttribute('sandbox', 'allow-scripts')
      frame.tabIndex = -1
      frame.title = screen.name
      frame.style.width = `${screen.width}px`
      frame.style.height = `${screen.height}px`
      // Пустая страница не должна мигнуть белым поверх картинки: видна, когда загрузилась.
      frame.style.opacity = '0'
      frame.addEventListener('load', () => { frame.style.opacity = '1' })
      frame.src = `/${shareId}/s/${screen.id}?v=${version}`
      screen.content.append(frame)
      screen.frame$ = frame
    }
  }
  const loaded = screens.filter((screen) => screen.frame$).sort((a, b) => a.usedAt - b.usedAt)
  for (const screen of loaded.slice(0, Math.max(0, loaded.length - MAX_LIVE))) {
    screen.frame$.remove()
    screen.frame$ = null
  }
}

/* Сборка холста ---------------------------------------------------------- */

/* Страница целиком заменяет прежнюю: её узлы, живые страницы экранов и картинки уходят из DOM. */
function build(page) {
  world.replaceChildren()
  screens = page.screens.map((screen) => ({ ...screen, bounds: boundsOf(screen) }))
  const byId = new Map(screens.map((screen) => [screen.id, screen]))
  groups = page.groups.map((group) => ({ ...group, rect: groupRect(group, byId) }))
  ordered = readingOrder(screens)

  for (const group of groups) {
    const node = el('div', 'group')
    node.style.transform = `translate(${group.rect.x}px, ${group.rect.y}px)`
    node.style.width = `${group.rect.width}px`
    node.style.height = `${group.rect.height}px`
    const header = el('div', 'group__header', escapeHtml(group.name))
    header.dataset.group = group.id
    node.append(header)
    world.append(node)
  }

  for (const screen of screens) {
    const i = INSETS[screen.frame]
    const frameWidth = screen.bounds.width
    const node = el('div', 'screen')
    node.dataset.screen = screen.id
    node.dataset.frame = screen.frame
    node.style.transform = `translate(${screen.x}px, ${screen.y}px)`
    node.style.width = `${frameWidth}px`
    node.style.height = `${screen.bounds.height}px`
    node.style.setProperty('--frame-width', frameWidth)
    node.style.setProperty('--top', `${i.top}px`)
    node.style.setProperty('--side', `${i.left}px`)
    node.append(el('div', 'screen__label', escapeHtml(screen.name)))
    const device = el('div', 'screen__device')
    if (screen.frame === 'window' || screen.frame === 'browser') {
      device.append(el('div', 'screen__chrome', `<span class="screen__lights"><i></i><i></i><i></i></span>${screen.frame === 'browser' ? `<span class="screen__address">${escapeHtml(screen.name)}</span>` : ''}`))
    }
    const content = el('div', 'screen__content')
    content.style.width = `${screen.width}px`
    content.style.height = `${screen.height}px`
    content.append(el('div', 'screen__placeholder', escapeHtml(screen.name)))
    const thumb = el('img', 'screen__thumb')
    thumb.alt = ''
    thumb.decoding = 'async'
    thumb.loading = 'lazy'
    thumb.addEventListener('error', () => thumb.remove())
    thumb.src = `/${shareId}/t/${screen.id}?v=${version}`
    content.append(thumb)
    device.append(content)
    if (screen.frame === 'phone') device.append(el('span', 'screen__island'))
    node.append(device)
    world.append(node)
    screen.content = content
  }

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('class', 'links')
  for (const link of page.links) {
    const shape = linkShape(link, byId)
    if (!shape) continue
    const path = document.createElementNS(svg.namespaceURI, 'path')
    path.setAttribute('class', 'link__line')
    path.setAttribute('d', shape.path)
    const dot = document.createElementNS(svg.namespaceURI, 'circle')
    dot.setAttribute('class', 'link__dot')
    dot.setAttribute('cx', shape.start.x)
    dot.setAttribute('cy', shape.start.y)
    svg.append(path, dot)
  }
  world.append(svg)
}

function updatePosition() {
  const steps = document.getElementById('steps')
  steps.hidden = screens.length < 2
  const index = current
  document.getElementById('previous').disabled = index <= 0
  document.getElementById('next').disabled = index >= ordered.length - 1
  document.getElementById('position').innerHTML =
    index < 0 ? `${ordered.length} screens` : `<b>${escapeHtml(ordered[index].name)}</b> · ${index + 1}/${ordered.length}`
}

/* Жесты: протяжка двигает, щипок и колесо масштабируют, касание подводит к экрану. */

const pointers = new Map()
let gesture = null

stage.addEventListener('pointerdown', (event) => {
  if (event.button !== 0) return
  cancelAnimationFrame(flight)
  stage.setPointerCapture(event.pointerId)
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY })
  gesture = {
    startedAt: performance.now(),
    origin: { x: event.clientX, y: event.clientY },
    target: event.target,
    moved: pointers.size > 1,
    last: null
  }
})

stage.addEventListener('pointermove', (event) => {
  const known = pointers.get(event.pointerId)
  if (!known || !gesture) return
  const before = [...pointers.values()]
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY })
  const after = [...pointers.values()]
  if (!gesture.moved && Math.hypot(event.clientX - gesture.origin.x, event.clientY - gesture.origin.y) < TAP_DISTANCE) return
  if (!gesture.moved) stage.dataset.panning = 'true'
  gesture.moved = true
  const rect = stage.getBoundingClientRect()
  if (after.length >= 2) {
    const [a0, b0] = before
    const [a1, b1] = after
    const distance0 = Math.hypot(a0.x - b0.x, a0.y - b0.y) || 1
    const distance1 = Math.hypot(a1.x - b1.x, a1.y - b1.y)
    const mid0 = { x: (a0.x + b0.x) / 2 - rect.left, y: (a0.y + b0.y) / 2 - rect.top }
    const mid1 = { x: (a1.x + b1.x) / 2 - rect.left, y: (a1.y + b1.y) / 2 - rect.top }
    const zoomed = zoomAround(mid0, view.zoom * (distance1 / distance0))
    setView({ ...zoomed, x: zoomed.x + (mid1.x - mid0.x), y: zoomed.y + (mid1.y - mid0.y) })
  } else {
    setView({ ...view, x: view.x + (event.clientX - known.x), y: view.y + (event.clientY - known.y) })
  }
})

function endPointer(event) {
  if (!pointers.has(event.pointerId)) return
  pointers.delete(event.pointerId)
  if (pointers.size > 0 || !gesture) return
  stage.dataset.panning = 'false'
  const tap = !gesture.moved && event.type === 'pointerup' && performance.now() - gesture.startedAt < 600
  const target = gesture.target
  gesture = null
  if (!tap || !(target instanceof Element)) return
  const header = target.closest('[data-group]')
  const node = target.closest('[data-screen]')
  const group = header && groups.find((g) => g.id === header.dataset.group)
  const screen = node && screens.find((s) => s.id === node.dataset.screen)
  if (group) focusGroup(group)
  else if (screen) focusScreen(screen)
}
stage.addEventListener('pointerup', endPointer)
stage.addEventListener('pointercancel', endPointer)

stage.addEventListener('wheel', (event) => {
  event.preventDefault()
  cancelAnimationFrame(flight)
  const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport().height : 1
  if (event.ctrlKey || event.metaKey) {
    const rect = stage.getBoundingClientRect()
    const delta = clamp(event.deltaY * unit, -40, 40)
    setView(zoomAround({ x: event.clientX - rect.left, y: event.clientY - rect.top }, view.zoom * Math.exp(-delta * 0.01)))
  } else {
    setView({ ...view, x: view.x - event.deltaX * unit, y: view.y - event.deltaY * unit })
  }
}, { passive: false })

document.getElementById('fit').addEventListener('click', showAll)
document.getElementById('previous').addEventListener('click', () => ordered[current - 1] && focusScreen(ordered[current - 1]))
document.getElementById('next').addEventListener('click', () => ordered[current + 1] && focusScreen(ordered[current + 1]))
document.addEventListener('keydown', (event) => {
  if (event.key === 'ArrowRight' && ordered[current + 1]) focusScreen(ordered[current + 1])
  else if (event.key === 'ArrowRight' && current < 0 && ordered[0]) focusScreen(ordered[0])
  else if (event.key === 'ArrowLeft' && ordered[current - 1]) focusScreen(ordered[current - 1])
  else if (event.key === 'Escape') showAll()
})
addEventListener('resize', scheduleFrames)

/* Страницы холста --------------------------------------------------------- */

/** Холст старой формы (без страниц) — одна страница. */
function pagesOf(canvas) {
  const list = Array.isArray(canvas.pages)
    ? canvas.pages
    : [{ id: 'main', name: canvas.name, screens: canvas.screens, groups: canvas.groups, links: canvas.links }]
  return list
    .filter((p) => p && Array.isArray(p.screens) && p.screens.length > 0)
    .map((p) => ({ ...p, groups: Array.isArray(p.groups) ? p.groups : [], links: Array.isArray(p.links) ? p.links : [] }))
}

function pageFromHash() {
  const id = new URLSearchParams(location.hash.slice(1)).get('page')
  return pages.find((p) => p.id === id) || pages[0]
}

function renderPageTabs() {
  const nav = document.getElementById('pages')
  nav.hidden = pages.length < 2
  if (nav.hidden) return
  for (const p of pages) {
    const tab = el('button', 'page-tab')
    tab.type = 'button'
    tab.textContent = p.name
    tab.title = p.name
    tab.dataset.page = p.id
    tab.addEventListener('click', () => openPage(p))
    nav.append(tab)
  }
  // Колесо мыши над строкой страниц прокручивает её вбок.
  nav.addEventListener('wheel', (event) => {
    if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return
    event.preventDefault()
    nav.scrollLeft += event.deltaY * (event.deltaMode === 1 ? 16 : 1)
  }, { passive: false })
}

function markPageTab() {
  const nav = document.getElementById('pages')
  for (const tab of nav.children) {
    const active = tab.dataset.page === page.id
    if (active) tab.setAttribute('aria-current', 'page')
    else tab.removeAttribute('aria-current')
    if (!active) continue
    // Выбранная страница видна в строке, даже если та прокручена.
    const left = tab.offsetLeft - 4
    const right = tab.offsetLeft + tab.offsetWidth + 4
    if (left < nav.scrollLeft) nav.scrollLeft = left
    else if (right > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = right - nav.clientWidth
  }
}

/* Начальный вид страницы: на узком экране (телефон) — первый экран, на широком — вся страница. */
function initialView() {
  const everything = viewFitting(allContent())
  if (everything.zoom < 0.3 && ordered.length > 1 && viewport().width < 700) {
    current = 0
    updatePosition()
    setView(viewFitting(screenFocus(ordered[0])))
  } else {
    setView(everything)
  }
}

function openPage(next) {
  if (!next || next === page) return
  cancelAnimationFrame(flight)
  clearTimeout(liveTimer)
  page = next
  current = -1
  build(page)
  updatePosition()
  if (pages.length > 1) {
    markPageTab()
    writeHash()
  }
  initialView()
}

/** Адрес ведёт на открытую страницу: ссылкой можно поделиться. История не растёт. */
function writeHash() {
  const hash = `#page=${encodeURIComponent(page.id)}`
  if (location.hash !== hash) history.replaceState(null, '', hash)
}

addEventListener('hashchange', () => {
  if (pages.length < 2 || !page) return
  const next = pageFromHash()
  if (next === page) writeHash()
  else openPage(next)
})

async function main() {
  const response = await fetch(`/${shareId}/data`, { cache: 'no-store' })
  if (!response.ok) return showMessage('This link is no longer available.')
  const data = await response.json()
  canvas = data.canvas
  version = Date.parse(data.updatedAt) || 0
  pages = pagesOf(canvas)
  if (pages.length === 0) return showMessage('This link is no longer available.')
  renderPageTabs()
  openPage(pageFromHash())
}
main().catch(() => showMessage('Could not open this link.'))
</script>
</body>
</html>
