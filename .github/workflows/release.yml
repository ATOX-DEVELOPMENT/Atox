# Каждый коммит в main с изменениями приложения выпускается релизом на GitHub:
# установленный Atox находит его и предлагает обновиться.
name: Release

on:
  push:
    branches: [main]
    paths:
      - app/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

# Релизы выходят строго по очереди, в порядке коммитов.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  # Версия — major.minor из package.json и номер сборки: 0.1.42. Общая для всех платформ.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          # Обе архитектуры собираются на Intel: машин macOS на Apple Silicon у GitHub часто не
          # хватает, и сборка часами стоит в очереди. Готовые node-pty есть под обе архитектуры.
          - platform: mac
            runner: macos-15-intel
            builder: --mac --arm64 --x64
            files: |
              app/dist/*.dmg
              app/dist/*.zip
              app/dist/latest-mac.json
          - platform: linux
            runner: ubuntu-24.04
            builder: --linux --x64
            files: |
              app/dist/*.AppImage
              app/dist/*.pacman
              app/dist/latest-linux.json
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Пакет pacman собирается через bsdtar.
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      # На Linux node-pty собирается из исходников: готовых сборок под него в пакете нет.
      - run: npm ci

      # Mac собирается на Intel-раннере, а бинарь claude под darwin-arm64 npm на Intel не ставит
      # (optional dep под другую архитектуру). Раскладываем оба тарбола руками — без второго
      # npm install, который перетирает первый. Без этого релизы 0.2.108 и 0.2.109 вышли без
      # бандла, и подписка Claude не отображалась.
      - if: matrix.platform == 'mac'
        run: |
          set -eu
          VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('node_modules/@anthropic-ai/claude-agent-sdk/package.json','utf8')).version)")
          for ARCH in arm64 x64; do
            PKG="@anthropic-ai/claude-agent-sdk-darwin-$ARCH"
            DIR="node_modules/@anthropic-ai/claude-agent-sdk-darwin-$ARCH"
            TGZ=$(npm pack "$PKG@$VER" --pack-destination /tmp --silent)
            rm -rf "$DIR"
            mkdir -p "$DIR"
            tar -xzf "/tmp/$TGZ" --strip-components=1 -C "$DIR"
            chmod +x "$DIR/claude"
            test -x "$DIR/claude"
          done

      # Так же с esbuild, который собирает экраны холста: в приложение кладётся бинарник
      # своей архитектуры, а npm на Intel-раннере ставит только darwin-x64.
      - if: matrix.platform == 'mac'
        run: |
          set -eu
          VER=$(node -p "require('esbuild/package.json').version")
          for ARCH in arm64 x64; do
            DIR="node_modules/@esbuild/darwin-$ARCH"
            if [ ! -x "$DIR/bin/esbuild" ]; then
              TGZ=$(npm pack "@esbuild/darwin-$ARCH@$VER" --pack-destination /tmp --silent)
              rm -rf "$DIR"
              mkdir -p "$DIR"
              tar -xzf "/tmp/$TGZ" --strip-components=1 -C "$DIR"
              chmod +x "$DIR/bin/esbuild"
            fi
            test -x "$DIR/bin/esbuild"
          done

      # Зависимости холста (react, lucide-react) собираются в resources/canvas-vendor,
      # без этой папки экраны-React в приложении не открываются.
      - run: npm run build:vendor

      - run: npm run typecheck

      - run: npx electron-vite build

      - run: npx electron-builder ${{ matrix.builder }} --publish never -c.extraMetadata.version="$VERSION"

      # Если бандл claude не долетел до .app, релиз бесполезен — лимиты и список моделей падают
      # как в 0.2.109. Проваливаем сборку, чтобы не публиковать такой релиз.
      - if: matrix.platform == 'mac'
        run: |
          set -eu
          test -x dist/mac-arm64/Atox.app/Contents/Resources/claude-cli/claude
          test -x dist/mac/Atox.app/Contents/Resources/claude-cli/claude
          for APP in dist/mac-arm64 dist/mac; do
            test -x "$APP/Atox.app/Contents/Resources/esbuild/esbuild"
            test -d "$APP/Atox.app/Contents/Resources/canvas-vendor"
          done
      - if: matrix.platform == 'linux'
        run: |
          set -eu
          test -x dist/linux-unpacked/resources/claude-cli/claude
          test -x dist/linux-unpacked/resources/esbuild/esbuild
          test -d dist/linux-unpacked/resources/canvas-vendor

      - name: Sign update manifest
        run: npm run release:manifest -- dist "$VERSION" ${{ matrix.platform }}
        env:
          ATOX_UPDATE_SIGNING_KEY: ${{ secrets.ATOX_UPDATE_SIGNING_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # Куда выкладывать релизы. По умолчанию — в этот же репозиторий. Когда исходники закрыты,
      # установщики и манифесты обновлений лежат в отдельном открытом репозитории: его задают
      # переменной RELEASES_REPOSITORY, а доступ к нему даёт токен RELEASES_TOKEN.
      - name: Publish release
        working-directory: release
        run: |
          target=()
          # Метка версии привязана к коммиту, только если релиз остаётся в репозитории с исходниками.
          if [ "$RELEASES_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "v$VERSION" * \
            --repo "$RELEASES_REPOSITORY" \
            --title "Atox $VERSION" \
            --notes "$(git -C .. log -1 --format=%s)" \
            "${target[@]}"
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
